name: Build APK and Deploy Landing Page

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "build-and-deploy"
  cancel-in-progress: false

jobs:
  build-apk:
    name: Build Android APK & Create Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "StepPulse v1.0.0 (Release)"
          body: |
            ### 👟 StepPulse v1.0.0 Initial Release
            
            This is the initial release of **StepPulse**, a 100% free, privacy-first Android step tracker.
            
            #### 🌟 Highlights
            - **Hardware Sensor Integration**: Real-time step counting with zero battery consumption.
            - **100% Offline & Private**: Stored locally in encrypted SQLite/Room database.
            - **Daily Stats & History**: Tracks distance (km), estimated calories burned (kcal), active walking time, and 7-day progress.
            - **Ongoing Notification**: Displays live progress and goal percentage without opening the app.
            
            #### 📥 Download
            Download the `app-debug.apk` asset below and install it directly on your Android phone!
          files: app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-pages:
    name: Deploy Landing Page to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
