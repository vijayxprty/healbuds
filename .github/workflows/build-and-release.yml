name: Build APK and Deploy Landing Page

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "build-and-deploy"
  cancel-in-progress: false

jobs:
  build-apk:
    name: Build Android APK & Create Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build APK
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk Healbuds-v2.0.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Healbuds-v2.0.0.apk
          path: Healbuds-v2.0.0.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.0
          name: "Healbuds v2.0.0 (Final Release)"
          body: |
            ### 🌱 Healbuds v2.0.0 — Final Permanent Release
            
            This is the official, final production release of **Healbuds**: a 100% free, permanent, on-device Android health and lifestyle platform.
            
            #### 🌟 What's Included:
            - **👟 Hardware Sensor Engine**: Android `TYPE_STEP_COUNTER` hardware pedometer with 10-step cadence filtering and vehicle rejection.
            - **🍱 Authentic Indian Thali Planner**: Interactive 6-katori plate (Dal, Rajma, Rice, Roti, Curd, Salad), Veg/Non-Veg toggle, custom meal builder with emojis.
            - **🔥 Smart Streaks & Full Calendar**: 2 allowed rest days/week without breaking streak, 30-day visual calendar grid, and 3-day inactivity rules.
            - **💧 Hydration Tracker & Alarms**: Quick 1-tap logging (+250ml / +500ml), daily target progress ring, and customizable reminder alerts.
            - **🌙 Sleep & Recovery Coaching**: 10:30 PM suggested wind-down and quiet hours.
            - **✨ VMS Buddy Mascot**: 9 custom expressions across walking, victory celebrations, workouts, rest days, and alerts.
            - **♥ Support Developer Pack**: Direct native UPI payment chooser (`Vijay Kumar`, `jaynishad2010@okhdfcbank`) with voluntary custom amount, copy toast, and Instagram footer.
            - **🎨 Official App Icon**: Custom mascot on pure white background packaged into all Android mipmap densities.
            
            #### 📥 Download & Install
            Download **`Healbuds-v2.0.0.apk`** below to install directly on your Android phone!
          files: |
            Healbuds-v2.0.0.apk
            app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-pages:
    name: Deploy Landing Page to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
