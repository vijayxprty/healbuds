name: Build APK and Deploy Landing Page

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "build-and-deploy"
  cancel-in-progress: false

jobs:
  build-apk:
    name: Build Android APK & Create Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build APK
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee build_output.txt || true
          if [ ! -f app/build/outputs/apk/debug/app-debug.apk ]; then
            KOTLIN_ERRORS=$(grep -E "^e: " build_output.txt | head -n 10 | tr '\n' ' | ')
            echo "::error file=build_output.txt::Kotlin Errors: $KOTLIN_ERRORS"
            exit 1
          fi
          cp app/build/outputs/apk/debug/app-debug.apk Healbuds-v2.2.0.apk
          cp app/build/outputs/apk/debug/app-debug.apk Healbuds.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Healbuds-v2.2.0.apk
          path: Healbuds-v2.2.0.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.2.0
          name: "Healbuds v2.2.0 (Complete Fresh Zero-Data Release)"
          body: |
            ### 🌱 Healbuds v2.2.0 — Complete Fresh Zero-Data Production Release
            
            This is the official, clean production release of **Healbuds**: a 100% free, private, on-device Android health and lifestyle platform.
            
            #### 🌟 What's Included:
            - **✨ 100% Fresh Start (Zero Dummy/Test Data)**: Steps, Streaks, Rest Days, and Water start completely at 0 fresh for the user. No test buttons or internal filter cards cluttering the UI.
            - **🍱 Interactive Circular Indian Thali Plate for ALL Meals**: True visual stainless-steel Thali plate in Jetpack Compose working across all 5 meal slots (🌅 Breakfast, ☀️ Lunch, ☕ Snacks, 🌙 Dinner, 🌃 Late Night). Tap any bowl to swap dishes in real-time!
            - **📋 Actionable Daily Diet Plan**: An integrated daily diet tracker with dynamically calculated daily calorie target budget based on user's height, weight, and fitness goal (Lose Weight deficit vs Gain Weight surplus).
            - **👤 Editable Personal Health Profile**: Users configure their personal height (cm), weight (kg), and fitness goal with live BMI and Mifflin-St Jeor calorie calculations.
            - **💧 Hydration Tracker with Actionable Notifications**: Choose reminder intervals (1 Hour, 2 Hours, 3 Hours, or Off). Real notifications deliver 3 quick action buttons: **"🥛 1 Glass (+250ml)"**, **"🍼 +500ml"**, and **"Skip"** right in your notification bar.
            - **🎯 Step Goal in Thousands & Custom Number**: Pick goals in thousands (5k to 15k) or enter any custom target number with plenty of inner ring clearance.
            - **🔥 Smart Streaks & Complete 30-Day Calendar**: 2 allowed rest days/week without breaking streak, complete 30-day November 2026 calendar grid with all 6 weeks fully displayed.
            - **🌙 Bedtime & Sleep Recovery Suggestions**: Calming suggestions with sleeping mascot illustration to optimize deep sleep and walking recovery.
            - **♥ Support Developer Pack**: Direct native UPI payment chooser (`Vijay Kumar`, `jaynishad2010@okhdfcbank`) with voluntary custom amount, copy toast, and Instagram footer.
            
            #### 📥 Download & Install
            Download **`Healbuds-v2.2.0.apk`** below to install directly on your Android phone!
          files: |
            Healbuds-v2.2.0.apk
            Healbuds.apk
            app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-pages:
    name: Deploy Landing Page to GitHub Pages
    runs-on: ubuntu-latest
    needs: build-apk
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Built APK
        uses: actions/download-artifact@v4
        with:
          name: Healbuds-v2.2.0.apk
          path: docs

      - name: Prepare APK Download Files
        run: |
          cp docs/Healbuds-v2.2.0.apk docs/Healbuds.apk
          ls -la docs

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
