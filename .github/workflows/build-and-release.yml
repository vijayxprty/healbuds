name: Build APK and Deploy Landing Page

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "build-and-deploy"
  cancel-in-progress: false

jobs:
  build-apk:
    name: Build Android APK & Create Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.0
          name: "Healbuds v2.0.0 (Release)"
          body: |
            ### 🌱 Healbuds v2.0.0 Release — Smart Steps, Indian Diet & Recovery Platform

            Welcome to the major v2.0 release of **Healbuds** (formerly StepPulse), the 100% free, playful, privacy-first Android health companion.

            #### 🌟 Highlights & New Features
            - **👟 Hardware Pedometer & Cadence Filter**: Accurate on-device step counting via `TYPE_STEP_COUNTER` with a 10-step buffer to filter false positives and vehicle vibrations. Zero battery drain.
            - **🍱 Authentic Indian Thali Diet Planner**: Interactive plate featuring Rajma, Curd, Rice, Dal, and Roti. Pure Veg and Non-Veg modes with macro breakdowns and custom dish builder.
            - **🔥 Smart Streaks & Rest Days**: Keep your streak alive! 2 rest days allowed per week (Mon to Sun) without breaking your streak. 3-day inactivity threshold before resetting.
            - **💧 Hydration Tracker & Alarms**: Quick 1-tap +250ml logging, daily water target progress, and customizable drink reminders.
            - **🌙 Sleep & Recovery Wind-Down**: Bedtime coaching with quiet hours.
            - **✨ Adorable Mascot Integration**: 9 expressive illustrations celebrating walking, workouts, rest days, milestones, and care.
            - **♥ Support the Developer Pack**: Clean UPI donation integration with QR code and deep-linking (`jaynishad2010@okhdfcbank`).

            #### 📥 Download & Install
            Download the `app-debug.apk` asset below and install directly on your Android phone!
          files: app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-pages:
    name: Deploy Landing Page to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
